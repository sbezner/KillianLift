<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <style>
    .body { fill: #d6dfe8; stroke: #111; stroke-width: 2; }
    .body2 { fill: #b5bfc9; stroke: #111; stroke-width: 2; }
    .accent { fill: #f0a000; stroke: #111; stroke-width: 1.5; }
    .rubber { fill: #333; stroke: #111; stroke-width: 1; }
    .dim { fill: none; stroke: #8B0000; stroke-width: 1; }
    .dimt { fill: #8B0000; font-size: 14px; }
    .lbl { fill: #111; font-size: 14px; }
    .leader { stroke: #111; stroke-width: 0.8; fill: none; }
    .title { fill: #111; font-size: 22px; font-weight: bold; }
    .center { fill: none; stroke: #111; stroke-width: 0.6; stroke-dasharray: 12 4 2 4; }
    .ghost { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <pattern id="ghatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#fff"/>

  <text x="40" y="50" class="title">KILLIAN LIFT - OUTRIGGER + CAM-LOCK FOOT DETAIL</text>
  <text x="40" y="78" class="lbl">Captive arm, single-motion pivot deploy, cam-lock pin, 1/2 in screw-jack leveling foot.</text>

  <text x="200" y="130" class="lbl" font-weight="bold">PLAN VIEW (TOP)</text>
  <text x="1100" y="130" class="lbl" font-weight="bold">SIDE SECTION</text>

  <!-- PLAN VIEW (deployed) -->
  <g transform="translate(80,160)">
    <!-- base body edge -->
    <rect x="0" y="180" width="200" height="120" class="body"/>
    <text x="60" y="244" class="lbl">BASE FRAME</text>

    <!-- outrigger arm deployed -->
    <rect x="200" y="220" width="500" height="40" class="body2"/>
    <!-- captive pivot inside base -->
    <circle cx="200" cy="240" r="14" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="200" cy="240" r="6" fill="#222"/>

    <!-- cam-lock at outboard end -->
    <rect x="610" y="200" width="60" height="80" class="accent" rx="4"/>
    <circle cx="640" cy="240" r="20" fill="#fff" stroke="#111"/>
    <rect x="635" y="215" width="10" height="50" fill="#222"/>

    <!-- leveling foot -->
    <circle cx="700" cy="240" r="34" class="rubber"/>
    <circle cx="700" cy="240" r="22" class="accent"/>
    <text x="690" y="244" class="lbl" font-size="11">FOOT</text>

    <!-- ghost stowed position -->
    <rect x="0" y="220" width="200" height="40" class="ghost"/>
    <text x="20" y="320" class="lbl" fill="#666" font-size="12">arm stowed (dashed) folds along base edge</text>

    <!-- dims -->
    <line x1="200" y1="160" x2="700" y2="160" class="dim"/>
    <polygon points="200,160 215,154 215,166" fill="#8B0000"/>
    <polygon points="700,160 685,154 685,166" fill="#8B0000"/>
    <text x="380" y="150" class="dimt">17.0 in / 432 mm extended reach</text>

    <line x1="200" y1="370" x2="610" y2="370" class="dim"/>
    <polygon points="200,370 215,364 215,376" fill="#8B0000"/>
    <polygon points="610,370 595,364 595,376" fill="#8B0000"/>
    <text x="320" y="392" class="dimt">14.0 in arm</text>

    <!-- callouts -->
    <line x1="200" y1="240" x2="120" y2="120" class="leader"/>
    <text x="80" y="108" class="lbl">[1] CAPTIVE PIVOT, sealed bushing</text>

    <line x1="640" y1="200" x2="640" y2="80" class="leader"/>
    <text x="540" y="68" class="lbl">[2] CAM-LOCK PIN, single-hand operation</text>

    <line x1="700" y1="240" x2="800" y2="100" class="leader"/>
    <text x="780" y="92" class="lbl">[3] LEVELING FOOT, 1/2 in adjust</text>
  </g>

  <!-- SIDE SECTION -->
  <g transform="translate(950,160)">
    <!-- ground -->
    <line x1="-50" y1="500" x2="900" y2="500" stroke="#111" stroke-width="1.5"/>
    <rect x="-50" y="500" width="950" height="20" fill="url(#ghatch)"/>

    <!-- arm side view -->
    <rect x="0" y="280" width="500" height="40" class="body2"/>
    <line x1="0" y1="300" x2="500" y2="300" class="center"/>

    <!-- cam-lock body (side) -->
    <rect x="380" y="260" width="60" height="80" class="accent"/>
    <circle cx="410" cy="300" r="14" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <!-- handle -->
    <rect x="404" y="200" width="12" height="60" fill="#222"/>
    <rect x="395" y="195" width="30" height="12" fill="#222"/>

    <!-- cam-lock pin engaging notches -->
    <line x1="410" y1="314" x2="410" y2="350" stroke="#111" stroke-width="3"/>
    <rect x="406" y="340" width="8" height="20" fill="#222"/>

    <!-- screw-jack tube -->
    <rect x="500" y="260" width="60" height="80" class="body"/>
    <!-- screw shaft inside (dashed) -->
    <line x1="530" y1="260" x2="530" y2="460" class="ghost"/>
    <!-- knob top -->
    <circle cx="530" cy="248" r="20" class="accent"/>
    <line x1="510" y1="248" x2="550" y2="248" stroke="#111"/>
    <line x1="530" y1="228" x2="530" y2="268" stroke="#111"/>

    <!-- foot pad -->
    <rect x="490" y="460" width="80" height="20" class="rubber"/>
    <rect x="500" y="445" width="60" height="15" class="accent"/>

    <!-- adjustment travel -->
    <line x1="620" y1="345" x2="620" y2="460" class="dim"/>
    <polygon points="620,345 614,360 626,360" fill="#8B0000"/>
    <polygon points="620,460 614,445 626,445" fill="#8B0000"/>
    <text x="630" y="408" class="dimt">1/2 in / 12.7 mm</text>
    <text x="630" y="426" class="dimt">screw travel</text>

    <!-- left base detail -->
    <rect x="-40" y="280" width="100" height="40" class="body"/>
    <text x="-30" y="305" class="lbl">BASE</text>

    <!-- callouts -->
    <line x1="410" y1="200" x2="500" y2="80" class="leader"/>
    <text x="490" y="72" class="lbl">[A] CAM HANDLE - 90 deg lock/unlock</text>

    <line x1="530" y1="248" x2="700" y2="160" class="leader"/>
    <text x="700" y="152" class="lbl">[B] FINGER KNOB, no tools required</text>

    <line x1="530" y1="380" x2="780" y2="380" class="leader"/>
    <text x="790" y="385" class="lbl">[C] ACME SCREW, self-locking</text>

    <line x1="530" y1="470" x2="780" y2="490" class="leader"/>
    <text x="790" y="495" class="lbl">[D] RUBBER FOOT, 3 in dia, 80A duro</text>
  </g>

  <!-- KEY FEATURES -->
  <g transform="translate(80,800)">
    <rect x="0" y="0" width="900" height="200" fill="none" stroke="#111"/>
    <text x="10" y="22" class="lbl" font-weight="bold">KEY DESIGN FEATURES</text>
    <text x="10" y="48" class="lbl">- Captive arm: pivots from stowed-along-base to deployed in one motion. No removable pins.</text>
    <text x="10" y="68" class="lbl">- Cam-lock at deploy stop: positive engagement, audible click, no torque required.</text>
    <text x="10" y="88" class="lbl">- Screw-jack foot: 1/2 in travel handles up to 0.7 deg slope without need for shims.</text>
    <text x="10" y="108" class="lbl">- Limit switch behind cam-lock: confirms all 4 outriggers deployed before lift function enables.</text>
    <text x="10" y="128" class="lbl">- Replaces Genie SLA stabilizer-set (which is removable and frequently lost on rentals).</text>
    <text x="10" y="148" class="lbl">- All steel structural members: 2x2 0.188 wall A500 HSS, paint-coated.</text>
    <text x="10" y="168" class="lbl">- Foot pad rated 1,200 lb static (each), 4x in deployed pattern = 4,800 lb static reaction.</text>
  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(1450,920)">
    <rect x="0" y="0" width="430" height="140" fill="none" stroke="#111" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="430" y2="35" stroke="#111"/>
    <line x1="0" y1="70" x2="430" y2="70" stroke="#111"/>
    <line x1="0" y1="105" x2="430" y2="105" stroke="#111"/>
    <line x1="215" y1="0" x2="215" y2="140" stroke="#111"/>
    <text x="10" y="22" class="lbl" font-weight="bold">DRAWING</text>
    <text x="10" y="58" class="lbl">KL-100-006</text>
    <text x="10" y="92" class="lbl">REV A</text>
    <text x="10" y="128" class="lbl">2026-05-09</text>
    <text x="225" y="22" class="lbl" font-weight="bold">TITLE</text>
    <text x="225" y="58" class="lbl">Outrigger Detail</text>
    <text x="225" y="92" class="lbl">Cam-lock + foot</text>
    <text x="225" y="128" class="lbl">Plan + Section</text>
  </g>
</svg>
