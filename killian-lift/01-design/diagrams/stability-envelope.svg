<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <style>
    .body { fill: #d6dfe8; stroke: #111; stroke-width: 2; }
    .accent { fill: #f0a000; stroke: #111; stroke-width: 1.5; }
    .safe { fill: #c6f0c6; stroke: #006600; stroke-width: 1.5; opacity: 0.7; }
    .warn { fill: #fff5b8; stroke: #c0a000; stroke-width: 1.5; opacity: 0.75; }
    .danger { fill: #ffc6c6; stroke: #cc0000; stroke-width: 1.5; opacity: 0.7; }
    .dim { fill: none; stroke: #8B0000; stroke-width: 1; }
    .dimt { fill: #8B0000; font-size: 14px; }
    .lbl { fill: #111; font-size: 14px; }
    .lblb { fill: #111; font-size: 14px; font-weight: bold; }
    .leader { stroke: #111; stroke-width: 0.8; fill: none; }
    .title { fill: #111; font-size: 22px; font-weight: bold; }
    .axis { fill: none; stroke: #111; stroke-width: 1.2; }
    .grid { fill: none; stroke: #ddd; stroke-width: 0.6; }
    .ghost { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 6 4; }
    .force { stroke: #cc0000; stroke-width: 3; fill: none; marker-end: url(#fa); }
    .cogline { fill: none; stroke: #4a0080; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="fa" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#cc0000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#fff"/>

  <text x="40" y="50" class="title">KILLIAN LIFT - STABILITY ENVELOPE / TIP-OVER GEOMETRY</text>
  <text x="40" y="78" class="lbl">Center of gravity vs lift height. Tip-over diamond, stability margin per ANSI/ASSP A10.5 and EN 13157.</text>

  <text x="200" y="130" class="lblb">A. SIDE ELEVATION - COG vs HEIGHT</text>
  <text x="1000" y="130" class="lblb">B. PLAN VIEW - TIP-OVER DIAMOND</text>

  <!-- A: side elevation with COG line -->
  <g transform="translate(120,170)">
    <!-- ground -->
    <line x1="0" y1="700" x2="780" y2="700" stroke="#111" stroke-width="1.5"/>

    <!-- base -->
    <rect x="280" y="660" width="220" height="40" class="body"/>
    <rect x="180" y="675" width="100" height="20" class="body"/>
    <rect x="500" y="675" width="100" height="20" class="body"/>

    <!-- mast extended at 25 ft -->
    <rect x="375" y="50" width="30" height="610" class="body"/>
    <!-- carriage with load at top -->
    <rect x="345" y="55" width="100" height="20" class="accent"/>
    <rect x="320" y="35" width="80" height="40" fill="#666" stroke="#111"/>

    <!-- COG marker at top (load + carriage) -->
    <circle cx="380" cy="60" r="10" fill="#4a0080" stroke="#111"/>
    <text x="395" y="65" class="lbl" fill="#4a0080">COG (full)</text>

    <!-- COG marker at lower height (collapsed) -->
    <rect x="375" y="540" width="30" height="120" class="ghost"/>
    <circle cx="380" cy="600" r="8" fill="#4a0080" stroke="#111" stroke-dasharray="2 2"/>
    <text x="395" y="604" class="lbl" fill="#4a0080" font-size="12">COG (stowed)</text>

    <!-- vertical COG line from load to ground -->
    <line x1="380" y1="60" x2="380" y2="700" class="cogline"/>

    <!-- show 1.5 deg tilt -->
    <g transform="rotate(1.5 380 700)" opacity="0.5">
      <rect x="375" y="50" width="30" height="610" fill="#cc0000" stroke="none"/>
    </g>

    <!-- height annotations -->
    <line x1="50" y1="60" x2="50" y2="700" class="dim"/>
    <polygon points="50,60 44,75 56,75" fill="#8B0000"/>
    <polygon points="50,700 44,685 56,685" fill="#8B0000"/>
    <text x="-10" y="380" class="dimt" transform="rotate(-90 -10,380)">25 ft</text>

    <!-- tilt angle arc -->
    <path d="M 380 660 A 40 40 0 0 1 388 658" stroke="#cc0000" stroke-width="2" fill="none"/>
    <text x="420" y="640" class="dimt">1.5 deg cutoff @ &gt; 10 ft</text>

    <!-- COG height annotation right -->
    <text x="490" y="60" class="lbl" font-weight="bold" fill="#4a0080">COG HEIGHT MATTERS:</text>
    <text x="490" y="80" class="lbl" font-size="12">stowed COG = 30 in (low)</text>
    <text x="490" y="98" class="lbl" font-size="12">full ext + 1500 lb COG = 295 in (high)</text>
    <text x="490" y="116" class="lbl" font-size="12">tip moment scales linearly with COG height</text>

    <!-- footprint span at base -->
    <line x1="180" y1="730" x2="600" y2="730" class="dim"/>
    <polygon points="180,730 195,724 195,736" fill="#8B0000"/>
    <polygon points="600,730 585,724 585,736" fill="#8B0000"/>
    <text x="320" y="752" class="dimt">52 in deployed footprint</text>
  </g>

  <!-- B: plan view tip diamond -->
  <g transform="translate(960,170)">
    <!-- center -->
    <line x1="400" y1="0" x2="400" y2="700" class="ghost"/>
    <line x1="0" y1="350" x2="800" y2="350" class="ghost"/>

    <!-- danger zone outside outrigger feet (red diamond) -->
    <polygon class="danger" points="400,40 730,350 400,660 70,350 50,350 50,30 750,30 750,670 50,670 50,350"/>
    <!-- Build a clean outer ring -->
    <rect x="20" y="20" width="760" height="660" class="danger"/>
    <!-- Warn zone (yellow diamond inside red) -->
    <polygon class="warn" points="400,40 730,350 400,660 70,350"/>
    <!-- Safe zone (green diamond) - the foot pattern itself -->
    <polygon class="safe" points="400,100 660,350 400,600 140,350"/>

    <!-- foot positions -->
    <circle cx="400" cy="100" r="22" fill="#f0a000" stroke="#111" stroke-width="1.5"/>
    <text x="395" y="105" class="lbl" font-size="11">B</text>
    <circle cx="660" cy="350" r="22" fill="#f0a000" stroke="#111" stroke-width="1.5"/>
    <text x="655" y="355" class="lbl" font-size="11">R</text>
    <circle cx="400" cy="600" r="22" fill="#f0a000" stroke="#111" stroke-width="1.5"/>
    <text x="395" y="605" class="lbl" font-size="11">F</text>
    <circle cx="140" cy="350" r="22" fill="#f0a000" stroke="#111" stroke-width="1.5"/>
    <text x="135" y="355" class="lbl" font-size="11">L</text>

    <!-- base body -->
    <rect x="320" y="270" width="160" height="160" class="body"/>
    <text x="365" y="358" class="lbl">BASE</text>

    <!-- COG line projection -->
    <circle cx="400" cy="350" r="8" fill="#4a0080" stroke="#111"/>
    <circle cx="400" cy="350" r="22" fill="none" stroke="#4a0080" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- COG drift example (load placed asymmetric) -->
    <line x1="400" y1="350" x2="540" y2="450" class="force"/>
    <text x="500" y="478" class="lbl" font-weight="bold" fill="#cc0000">COG drift if load shifts +6 in</text>

    <!-- legend zones -->
    <text x="160" y="180" class="lblb" fill="#006600">SAFE</text>
    <text x="660" y="200" class="lblb" fill="#c0a000">WARN</text>
    <text x="660" y="50" class="lblb" fill="#cc0000">TIP</text>

    <!-- dimensions -->
    <line x1="140" y1="700" x2="660" y2="700" class="dim"/>
    <polygon points="140,700 155,694 155,706" fill="#8B0000"/>
    <polygon points="660,700 645,694 645,706" fill="#8B0000"/>
    <text x="350" y="724" class="dimt">52 in</text>

    <line x1="780" y1="100" x2="780" y2="600" class="dim"/>
    <polygon points="780,100 774,115 786,115" fill="#8B0000"/>
    <polygon points="780,600 774,585 786,585" fill="#8B0000"/>
    <text x="800" y="350" class="dimt" transform="rotate(-90 800,350)">52 in</text>

    <!-- key callouts -->
    <line x1="400" y1="350" x2="400" y2="770" class="leader"/>
    <text x="220" y="790" class="lbl" font-weight="bold">[1] COG must remain inside green diamond at all times.</text>
  </g>

  <!-- TABLE -->
  <g transform="translate(60,920)">
    <rect x="0" y="0" width="1370" height="140" fill="none" stroke="#111"/>
    <text x="10" y="22" class="lblb">STABILITY MARGIN TABLE</text>
    <line x1="0" y1="32" x2="1370" y2="32" stroke="#111" stroke-width="0.8"/>
    <line x1="0" y1="55" x2="1370" y2="55" stroke="#111" stroke-width="0.8"/>
    <line x1="0" y1="78" x2="1370" y2="78" stroke="#111" stroke-width="0.8"/>
    <line x1="0" y1="101" x2="1370" y2="101" stroke="#111" stroke-width="0.8"/>
    <line x1="0" y1="124" x2="1370" y2="124" stroke="#111" stroke-width="0.8"/>

    <text x="10" y="48" class="lbl">Lift height</text>
    <text x="180" y="48" class="lbl">Load (rated)</text>
    <text x="380" y="48" class="lbl">Tip moment about edge</text>
    <text x="700" y="48" class="lbl">Resisting moment (lift wt + outrigger)</text>
    <text x="1100" y="48" class="lbl">Static SF</text>
    <text x="1230" y="48" class="lbl">Status</text>

    <text x="10" y="71" class="lbl">5 ft</text>
    <text x="180" y="71" class="lbl">1,500 lb</text>
    <text x="380" y="71" class="lbl">8,500 in-lb</text>
    <text x="700" y="71" class="lbl">62,000 in-lb</text>
    <text x="1100" y="71" class="lbl" fill="#006600">7.3:1</text>
    <text x="1230" y="71" class="lbl" fill="#006600">SAFE</text>

    <text x="10" y="94" class="lbl">15 ft</text>
    <text x="180" y="94" class="lbl">1,500 lb</text>
    <text x="380" y="94" class="lbl">15,300 in-lb</text>
    <text x="700" y="94" class="lbl">62,000 in-lb</text>
    <text x="1100" y="94" class="lbl" fill="#006600">4.0:1</text>
    <text x="1230" y="94" class="lbl" fill="#006600">SAFE</text>

    <text x="10" y="117" class="lbl">25 ft (max)</text>
    <text x="180" y="117" class="lbl">1,500 lb</text>
    <text x="380" y="117" class="lbl">25,500 in-lb</text>
    <text x="700" y="117" class="lbl">62,000 in-lb</text>
    <text x="1100" y="117" class="lbl" fill="#006600">2.4:1</text>
    <text x="1230" y="117" class="lbl" fill="#006600">SAFE (above 2:1 req.)</text>

    <text x="10" y="138" class="lbl" font-style="italic">Calculations assume load centered on fork. Tilt cutoff at 1.5 deg further reduces practical risk.</text>
  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(1450,920)">
    <rect x="0" y="0" width="430" height="140" fill="none" stroke="#111" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="430" y2="35" stroke="#111"/>
    <line x1="0" y1="70" x2="430" y2="70" stroke="#111"/>
    <line x1="0" y1="105" x2="430" y2="105" stroke="#111"/>
    <line x1="215" y1="0" x2="215" y2="140" stroke="#111"/>
    <text x="10" y="22" class="lbl" font-weight="bold">DRAWING</text>
    <text x="10" y="58" class="lbl">KL-100-009</text>
    <text x="10" y="92" class="lbl">REV A</text>
    <text x="10" y="128" class="lbl">2026-05-09</text>
    <text x="225" y="22" class="lbl" font-weight="bold">TITLE</text>
    <text x="225" y="58" class="lbl">Stability Envelope</text>
    <text x="225" y="92" class="lbl">Tip-over geometry</text>
    <text x="225" y="128" class="lbl">2 views + table</text>
  </g>
</svg>
