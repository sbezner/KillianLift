<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Killian Lift</title>
  <meta name="description" content="Killian Lift design and go-to-market package." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="gate">
    <form id="gate-form" autocomplete="off">
      <div class="gate-card">
        <div class="gate-mark">KILLIAN</div>
        <div class="gate-sub">Design and go-to-market package</div>
        <label for="gate-pw" class="gate-label">Password</label>
        <input id="gate-pw" type="password" autocomplete="off" autofocus />
        <button id="gate-btn" type="submit">Enter</button>
        <div id="gate-msg" class="gate-msg"></div>
        <div class="gate-hint">Shared privately. Do not redistribute.</div>
      </div>
    </form>
  </div>

  <div id="app" hidden>
    <header id="topbar">
      <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
      <a href="#/README.md" class="brand">
        <span class="brand-mark">KILLIAN</span>
        <span class="brand-sub">design package</span>
      </a>
      <button id="signout" title="Sign out">Sign out</button>
    </header>

    <aside id="sidebar"></aside>

    <main id="content">
      <div id="loading">Loading...</div>
    </main>

    <footer id="footer">
      <span>Killian Lift &middot; private working draft &middot; May 2026</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
